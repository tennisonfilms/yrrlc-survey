<body>

  ]},

    {id:"l_board",q:"The Board of Directors shall consist of 5 elected members",current:"5 Directors",locked:true,options:["Agree","Disagree"]},
    {id:"l_comp",q:"Directors shall serve without pay; reasonable expenses reimbursed with receipts",current:"Same, but no receipt or approval process specified",locked:true,options:["Agree","Disagree"]},
    {id:"term_length",q:"Director term length",current:"Mixed: Resident Director 1 year, Developer Director 1 year, Directors at Large 3 years staggered",options:["1 year","2 years","3 years, staggered","Mixed: different seats have different terms (1\u20133 years)"]},
    {id:"term_limits",q:"Director term limits",current:"None",options:["1 term, then sit out 1 year","2 consecutive terms, then sit out 1 year"]},
    {id:"removal",q:"How can a Director be removed?",current:"Three-fourths vote plus Developer assent, or conviction of malfeasance",options:["Majority vote of members at a noticed meeting","Two-thirds vote of members at a noticed meeting"]},
  ]},
  {title:"Meetings and Voting",questions:[
    {id:"l_annual",q:"Members should be able to attend meetings virtually in addition to in-person",current:"Not addressed. Meetings are in-person only.",locked:true,options:["Agree","Disagree"]},
    {id:"l_notice",q:"Written notice of at least 30 days is required for all meetings",current:"30 days",locked:true,options:["Agree","Disagree"]},
    {id:"l_proxy",q:"Members may cast proxy votes",current:"Proxy allowed",locked:true,options:["Agree","Disagree"]},
    {id:"l_current",q:"A member must be current on all assessments in order to vote",current:"Same",locked:true,options:["Agree","Disagree"]},
    {id:"special_meeting",q:"Who can call a Special Meeting?",current:"Board or 10% of lot owners",options:["Board only","Board or petition of 5% of lot owners","Board or petition of 10% of lot owners"]},
    {id:"quorum",q:"Quorum requirement",current:"10% of lots (plus Developer)",options:["10% of lots","20% of lots"]},
  ]},
  {title:"Financial Controls",questions:[

    {id:"bidding",q:"Competitive bidding requirement",current:"None",options:["3+ bids required for $2,500 and up","3+ bids required for $5,000 and up"]},
    {id:"selfdealing",q:"Self-dealing restrictions",current:"Disclosure only; no objection needed. Blanket waiver for Aspen Gold Ranches.",options:["Disclosure + recusal + competing bids required","Absolute ban: no Director or family member contracts"]},
    {id:"budget_overrun",q:"Budget overrun controls",current:"None",options:["No cap, Board decides","10% over budget requires member vote"]},
    {id:"emergency",q:"Should the Board have emergency spending authority?",current:"Yes, with no definition of emergency and no member ratification required",options:["Yes","No"]},
    {id:"interest_rate",q:"Interest on late assessments",current:"10% per year",options:["No interest","6% per year","10% per year"]},
    {id:"lien",q:"Can the Corporation file a lien for unpaid assessments?",current:"Yes",options:["Yes","No"]},

    {id:"enforce_notice",q:"How much notice before enforcement action?",current:"30 days written notice",options:["Prefer no covenants, no enforcement needed","30 days written notice","60+ days written notice"]},
    {id:"enforce_lawsuit",q:"Who authorizes a covenant enforcement lawsuit?",current:"Board decides unilaterally",options:["Board decides unilaterally","Majority vote of members required"]},
    {id:"enforce_reporting",q:"Litigation cost reporting",current:"None",options:["Cost estimate before vote, annual updates","Cost estimate before vote, quarterly updates"]},
  ]},
  {title:"Land Use",questions:[
    {id:"home_business",q:"Should home businesses be allowed?",current:"Allowed, as long as activities do not bring members of the general public to the property (Covenants Section 7A)",options:["No","Yes","Yes, as long as no public traffic to the property"]},
    {id:"nuisance",q:"Nuisance/noxious activity prohibition",current:"Prohibited",options:["No restriction (rely on county nuisance law)","Prohibited"]},
    {id:"junk",q:"Junk and vehicle storage",current:"No junk or unusable materials. Max 3 vehicles and 3 trailers outside.",options:["No restriction","No junk visible from road or neighbors; 3 vehicles/3 trailers outside"]},

    {id:"outbuilding_convert",q:"Converting outbuildings to dwellings",current:"Prohibited (added 2020)",options:["Allowed","Prohibited"]},
    {id:"construction_time",q:"Construction completion timeline",current:"12 months, extensions available",options:["No timeline","12 months, extensions available","24 months, extensions available"]},
    {id:"exterior_materials",q:"Exterior material restrictions on dwellings",current:"Natural materials (wood, log, stone) in rustic/earthen tones",options:["No restrictions","Any materials, must blend with surroundings (color/tone only)"]},

  ]},

function buildText(answers,multiAnswers,otherText,name){
  var lines=[];if(name)lines.push("Name / Lot #: "+name);
  lines.push("Submitted: "+new Date().toLocaleString());lines.push("");
  SECTIONS.forEach(function(s){
    var ans=s.questions.filter(function(q){return answers[q.id]||(multiAnswers[q.id]&&multiAnswers[q.id].length);});
    if(!ans.length)return;lines.push(s.title.toUpperCase());
    ans.forEach(function(q){
      if(q.multi){var vals=multiAnswers[q.id]||[];lines.push("  "+q.q+": "+(vals.length?vals.join(", "):"(none)"));}
      else{var val=answers[q.id];if(val==="__other__")val="Other: "+(otherText[q.id]||"");else if(val==="Disagree"&&otherText[q.id])val="Disagree - "+otherText[q.id];lines.push("  "+q.q+": "+val);}
    });lines.push("");});
  var un=[];SECTIONS.forEach(function(s){s.questions.forEach(function(q){if(!answers[q.id]&&!(multiAnswers[q.id]&&multiAnswers[q.id].length))un.push(q);});});
  if(un.length){lines.push("UNANSWERED ("+un.length+")");un.forEach(function(q){lines.push("  - "+q.q);});}
  return lines.join("\n");
}

function App(){
  var _a=useState({}),answers=_a[0],setAnswers=_a[1];
  var _m=useState({}),multiAnswers=_m[0],setMultiAnswers=_m[1];
  var _o=useState({}),otherText=_o[0],setOtherText=_o[1];
  var ic={};SECTIONS.forEach(function(s){ic[s.title]=true;});
  var _c=useState(ic),collapsed=_c[0],setCollapsed=_c[1];
  var _n=useState(""),name=_n[0],setName=_n[1];
  var _sub=useState(false),submitted=_sub[0],setSubmitted=_sub[1];
  var _si=useState(false),submitting=_si[0],setSubmitting=_si[1];
  var _er=useState(""),error=_er[0],setError=_er[1];
  var _ne=useState(false),nameError=_ne[0],setNameError=_ne[1];

  var totalQs=0;SECTIONS.forEach(function(s){totalQs+=s.questions.length;});
  var md=0;Object.values(multiAnswers).forEach(function(v){if(v&&v.length)md++;});
  var answered=Object.keys(answers).length+md;
  var pct=totalQs>0?Math.round((answered/totalQs)*100):0;

  function pick(id,val){
    setAnswers(function(p){var n=Object.assign({},p);n[id]=val;return n;});
    if(val!=="__other__"&&val!=="Disagree")setOtherText(function(p){var n=Object.assign({},p);delete n[id];return n;});
  }
  function toggleMulti(id,val){
    setMultiAnswers(function(p){
      var curr=p[id]||[];var next;
      if(val==="None of the above"){next=curr.indexOf(val)>=0?[]:[val];}
      else{var w=curr.filter(function(v){return v!=="None of the above";});next=w.indexOf(val)>=0?w.filter(function(v){return v!==val;}):w.concat([val]);}
      var n=Object.assign({},p);n[id]=next;return n;
    });
  }
  function doSubmit(){
    if(!name.trim()){setNameError(true);return;}
    setNameError(false);setSubmitting(true);setError("");
    var text=buildText(answers,multiAnswers,otherText,name);
    // Use a real HTML form - most reliable Formspree method
    var iframe=document.getElementById("fs-iframe");
    if(!iframe){iframe=document.createElement("iframe");iframe.id="fs-iframe";iframe.name="fs-iframe";iframe.style.display="none";document.body.appendChild(iframe);}
    var form=document.createElement("form");
    form.method="POST";form.action=FORMSPREE_URL;form.target="fs-iframe";form.style.display="none";
    var f1=document.createElement("input");f1.name="name";f1.value=name;form.appendChild(f1);
    var f2=document.createElement("input");f2.name="_subject";f2.value="YRRLC Survey Response: "+name;form.appendChild(f2);
    var f3=document.createElement("textarea");f3.name="message";f3.value=text;form.appendChild(f3);
    document.body.appendChild(form);
    iframe.onload=function(){setSubmitted(true);setSubmitting(false);document.body.removeChild(form);};
    form.submit();
    setTimeout(function(){if(!submitted){setSubmitted(true);setSubmitting(false);}},3000);
  }

  var dot=function(on){return{width:15,height:15,borderRadius:8,flexShrink:0,marginTop:1,border:on?"4px solid #3b82f6":"2px solid #333d50"};};
  var chk=function(on){return{width:15,height:15,borderRadius:3,flexShrink:0,marginTop:1,border:on?"none":"2px solid #333d50",background:on?"#3b82f6":"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#fff"};};
  var optS=function(sel){return{padding:"8px 12px",borderRadius:6,cursor:"pointer",marginBottom:3,border:sel?"1px solid #3b82f6":"1px solid #161e30",background:sel?"#141c34":"#0b1018",display:"flex",alignItems:"flex-start",gap:10};};
  var lblS=function(sel){return{fontSize:13,color:sel?"#e2e8f0":"#7a8aa0"};};
  var inpS=function(c){return{width:"100%",padding:"5px 8px",borderRadius:4,border:"1px solid #1e293b",background:"#090e18",color:c||"#94a3b8",fontSize:12,fontFamily:"inherit",outline:"none",marginTop:5};};

  if(submitted){
    return e("div",{style:{fontFamily:"'IBM Plex Sans',system-ui,sans-serif",background:"#090e18",color:"#c8d0e0",minHeight:"100vh",padding:"16px",display:"flex",alignItems:"center",justifyContent:"center"}},
      e("div",{style:{textAlign:"center"}},e("div",{style:{fontSize:32,marginBottom:12}},"\u2713"),e("div",{style:{fontSize:18,fontWeight:600,color:"#4ade80",marginBottom:8}},"Response submitted"),e("div",{style:{fontSize:13,color:"#5a7a9a"}},"Thank you for participating.")));
  }

  function rOpt(qId,opt,sel,locked){
    var isD=locked&&opt==="Disagree";
    return e("div",{key:opt,onClick:function(){pick(qId,opt);},style:optS(sel===opt)},
      e("div",{style:dot(sel===opt)}),
      e("div",{style:{flex:1}},e("div",{style:lblS(sel===opt)},opt),
        isD&&sel==="Disagree"?e("input",{type:"text",value:otherText[qId]||"",onClick:function(ev){ev.stopPropagation();},onChange:function(ev){setOtherText(function(p){var n=Object.assign({},p);n[qId]=ev.target.value;return n;});},placeholder:"What would you prefer instead? (optional)",style:inpS("#d4a0a0")}):null));
  }
  function rNP(qId,sel){
    return e("div",{key:"__np__",onClick:function(){pick(qId,NP);},style:optS(sel===NP)},
      e("div",{style:dot(sel===NP)}),e("div",{style:lblS(sel===NP)},NP));
  }
  function rOther(qId,sel){
    return e("div",{key:"__other__",onClick:function(){pick(qId,"__other__");},style:optS(sel==="__other__")},
      e("div",{style:dot(sel==="__other__")}),
      e("div",{style:{flex:1}},e("div",{style:lblS(sel==="__other__")},"Other"),

  }
  function rMulti(qId,opt,ms){
    var on=ms.indexOf(opt)>=0;
    return e("div",{key:opt,onClick:function(){toggleMulti(qId,opt);},style:optS(on)},
      e("div",{style:chk(on)},on?"\u2713":null),e("div",{style:lblS(on)},opt));
  }

  var secs=SECTIONS.map(function(section){
    var isOpen=!collapsed[section.title];
    var sa=section.questions.filter(function(q){return answers[q.id]||(multiAnswers[q.id]&&multiAnswers[q.id].length);}).length;
    var body=null;
    if(isOpen){
      var qs=section.questions.map(function(q,qi){
        var sel=answers[q.id];var ms=multiAnswers[q.id]||[];var mb=qi<section.questions.length-1?22:0;
        var ch=[e("div",{key:"q",style:{fontSize:13,fontWeight:600,color:"#b4c0d4",marginBottom:2}},q.q)];
        if(q.multi)ch.push(e("div",{key:"h",style:{fontSize:11,color:"#3e5a7a",marginBottom:4}},"Select all that apply"));
        if(q.current)ch.push(e("div",{key:"c",style:{fontSize:11,color:"#3e5a7a",fontStyle:"italic",marginBottom:8}},"Current: "+q.current));
        if(q.multi){
          q.options.forEach(function(opt){ch.push(rMulti(q.id,opt,ms));});
        } else if(q.locked){
          // Locked: Agree, Disagree, then No preference
          q.options.forEach(function(opt){ch.push(rOpt(q.id,opt,sel,true));});
          ch.push(rNP(q.id,sel));
        } else if(q.noNP){
          // No NP, no Other (start here question)
          q.options.forEach(function(opt){ch.push(rOpt(q.id,opt,sel,false));});
          ch.push(rOther(q.id,sel));
        } else {
          // Regular: options, then No preference, then Other
          q.options.forEach(function(opt){ch.push(rOpt(q.id,opt,sel,false));});
          ch.push(rNP(q.id,sel));
          ch.push(rOther(q.id,sel));
        }
        return e("div",{key:q.id,style:{marginBottom:mb}},ch);
      });
      body=e("div",{style:{padding:"8px 18px 18px"}},qs);
    }
    return e("div",{key:section.title,style:{marginBottom:12,background:"#10151f",borderRadius:10,border:"1px solid #1a2540",overflow:"hidden"}},
      e("div",{onClick:function(){setCollapsed(function(p){var n=Object.assign({},p);n[section.title]=isOpen;return n;});},style:{padding:"12px 18px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",background:isOpen?"#141c2c":"#10151f"}},
        e("div",{style:{fontSize:13,fontWeight:600,color:"#d1d9e6"}},section.title),
        e("div",{style:{display:"flex",alignItems:"center",gap:8}},
          e("span",{style:{fontSize:11,color:"#3e5a7a"}},sa+"/"+section.questions.length),
          e("span",{style:{color:"#3e5a7a",transform:isOpen?"rotate(180deg)":"",transition:"transform 0.2s"}},"\u25BE"))),body);
  });

  return e("div",{style:{fontFamily:"'IBM Plex Sans',system-ui,sans-serif",background:"#090e18",color:"#c8d0e0",minHeight:"100vh",padding:"16px 12px"}},
    e("div",{style:{maxWidth:700,margin:"0 auto"}},
      e("div",{style:{textAlign:"center",marginBottom:28,paddingTop:8}},
        e("div",{style:{fontSize:10,letterSpacing:4,textTransform:"uppercase",color:"#44546a",marginBottom:8}},"Yellowstone River Ranch Landowners Corporation"),
        e("h1",{style:{fontSize:22,fontWeight:700,color:"#e2e8f0",marginBottom:4}},"Covenants and Bylaws Input Survey"),

      e("div",{style:{marginBottom:16,background:"#10151f",borderRadius:10,border:"1px solid #1a2540",padding:"14px 18px"}},
        e("div",{style:{fontSize:13,fontWeight:500,color:"#b4c0d4",marginBottom:6}},"Your name and lot number"),
        e("input",{type:"text",value:name,onChange:function(ev){setName(ev.target.value);if(ev.target.value.trim())setNameError(false);},style:{width:"100%",padding:"8px 10px",borderRadius:6,border:"1px solid #1e293b",background:"#090e18",color:"#c8d0e0",fontSize:13,fontFamily:"inherit",outline:"none"}}),

        error?e("div",{style:{marginTop:8,fontSize:13,color:"#f87171"}},error):null):null,
      e("div",{style:{textAlign:"center",marginTop:24,fontSize:10,color:"#1a2030",paddingBottom:32}},"Yellowstone River Ranch Landowners Corporation")),
    e("div",{style:{position:"fixed",bottom:0,left:0,right:0,background:"#0a0f1a",borderTop:"1px solid #1a2540",padding:"8px 16px",zIndex:999,display:"flex",alignItems:"center",gap:12}},
      e("div",{style:{flex:1,height:8,background:"#161e30",borderRadius:4,overflow:"hidden"}},
        e("div",{style:{height:"100%",width:pct+"%",background:pct===100?"#4ade80":"#3b82f6",borderRadius:4,transition:"width 0.3s"}})),
      e("div",{style:{fontSize:12,color:"#5a7a9a",whiteSpace:"nowrap",minWidth:80,textAlign:"right"}},answered+"/"+totalQs+" ("+pct+"%)"))
  );
}
ReactDOM.render(e(App),document.getElementById("root"));
</script>
